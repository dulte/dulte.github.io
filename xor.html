    <body>
    
        <div class="container">
            <h2> XOR Breaker</h2>
            <div class=input>
                <textarea rows="5" cols="60" id="input">
                    
                </textarea> 
                
            </div>
            <div class="setting">
                    <label>Key:</label>
                    <input id="key" name="key" type="text"/>
            </div>  

            <div id="hex_base64_ascii" class="setting">
                <label>Encoding</label>
                <input type="radio" name="encoding" value="ascii" id="encoding_radio" checked> Ascii
                <input type="radio" name="encoding" value="hex" id="encoding_radio" > Hex
                <input type="radio" name="encoding" value="base64" id="encoding_radio" > Base64
            </div>  

            
    

            <div class="output-container">
                
                <textarea rows="5" cols="60" id="output">   
                </textarea> 
            </div>

            <div id="hex_base64_ascii" class="setting">
                    <label>Decoding</label>
                    <input type="radio" name="decoding" value="ascii" id="decoding_radio"  checked> Ascii
                    <input type="radio" name="decoding" value="hex" id="decoding_radio"> Hex
                    <input type="radio" name="decoding" value="base64" id="decoding_radio"> Base64
            </div>  
            <div class="btn-container">
                <button type="button" class="btn" id="encrypt">Encrypt or Decrypt</button>
                <button type="button" class="btn" id="solve_single">Solve Single Character</button>
                <button type="button" class="btn" id="solve_repeating">Solve Repeating Key</button>
            </div>


        </div>

    <script>
            document.getElementById('encrypt').onclick = function(){
                var cipher = document.getElementById('input').value.trim();
                var key = document.getElementById('key').value;

                cipher = checkEncoding(cipher);
                key = checkEncoding(key);

           
                result = xor(cipher, key);
               
                
                result = checkDecoding(result);
                

                document.getElementById('output').textContent = result;
            }

            function checkEncoding(str){
                var elements = document.getElementsByName("encoding");
                var encoding;
                for(i=0; i<elements.length; i++){
                    if(elements[i].checked)
                    encoding = elements[i].value
                }
                
                if(encoding == "ascii"){
                    return str;
                }else if(encoding == "hex"){
                    return hexToAscii(str);
                }else{
                    return base64ToAscii(str);
                }
            }

            function checkDecoding(str){
                var elements = document.getElementsByName("decoding");
                var decoding;
                for(i=0; i<elements.length; i++){
                    if(elements[i].checked)
                    decoding = elements[i].value
                }
                if(decoding == "ascii"){
                    return str;
                }else if(decoding == "hex"){
                    return asciiToHex(str);
                }else{
                    return asciiToBase64(str);
                }
            }
