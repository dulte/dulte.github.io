<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6f3cff"/>
      <stop offset="100%" stop-color="#4b1fa8"/>
    </linearGradient>
    <linearGradient id="lockGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d9d2ff"/>
    </linearGradient>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bg)"/>

  <!-- Block -->
  <rect x="140" y="220" width="232" height="168" rx="32" fill="url(#lockGrad)"/>

  <!-- Shackle -->
  <path d="M184 220v-36c0-40 32-72 72-72s72 32 72 72v36"
        fill="none"
        stroke="url(#lockGrad)"
        stroke-width="28"
        stroke-linecap="round"/>

  <!-- Keyhole -->
  <circle cx="256" cy="286" r="18" fill="#4b1fa8"/>
  <rect x="246" y="300" width="20" height="44" rx="10" fill="#4b1fa8"/>

  <!-- Small salt crystals / dots -->
  <circle cx="172" cy="156" r="8" fill="#ffffff" opacity="0.9"/>
  <circle cx="338" cy="146" r="6" fill="#ffffff" opacity="0.75"/>
  <circle cx="364" cy="178" r="7" fill="#ffffff" opacity="0.8"/>
</svg>